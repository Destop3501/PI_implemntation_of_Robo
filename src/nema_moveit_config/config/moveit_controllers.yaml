# MoveIt uses this configuration for controller management

moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - body_controller
    - leftarm_controller
    - rightarm_controller

  body_controller:
    type: FollowJointTrajectory
    joints:
      - body_joint
      - face_joint_x
    # FIX: Corrected action_ns to avoid duplicating the controller name in the topic path
    action_ns: follow_joint_trajectory
    default: true
  leftarm_controller:
    type: FollowJointTrajectory
    joints:
      - left_joint1
      - left_joint2
      - left_joint3
    # FIX: Corrected action_ns to avoid duplicating the controller name in the topic path
    action_ns: follow_joint_trajectory
    default: true
  rightarm_controller:
    type: FollowJointTrajectory
    joints:
      - right_joint1
      - right_joint2
      - right_joint3
    # FIX: Corrected action_ns to avoid duplicating the controller name in the topic path
    action_ns: follow_joint_trajectory
    default: true